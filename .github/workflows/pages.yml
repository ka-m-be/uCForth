# pages.yml - build all targets into build/, then publish the folder ucf
# with build/ on GitHub Pages. Then build/ucf-web.html runs in a web
# browser, and it finds the source files (INCLUDE) one folder above it.
#
# The commands are those of the READMEs of the targets (doc/start.md,
# "All builds and checks"), with the C bootstrap VM. This file is the
# only build script of the project, an exception for GitHub Pages.
# The tests do not run here.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The C bootstrap VM
        run: cc -O2 -o build/ucf-c bootstrap/c/ucf.c

      - name: macOS on Apple silicon
        run: build/ucf-c -32 host/files.fs targets/macos-a64/build.fs </dev/null
      - name: macOS on Apple silicon, the tool ucf
        run: build/ucf-c -32 host/files.fs tools/ucf.fs targets/macos-a64/build.fs </dev/null
      - name: macOS on Intel
        run: build/ucf-c -32 host/files.fs targets/macos-x64/build.fs </dev/null
      - name: macOS on Intel, the tool ucf-intel
        run: build/ucf-c -32 host/files.fs tools/ucf.fs targets/macos-x64/build.fs </dev/null
      - name: Linux on 64-bit ARM
        run: build/ucf-c -32 host/files.fs targets/linux-a64/build.fs </dev/null
      - name: Linux on 64-bit ARM, the tool ucf-a64
        run: build/ucf-c -32 host/files.fs tools/ucf.fs targets/linux-a64/build.fs </dev/null
      - name: Linux on x86-64
        run: build/ucf-c -32 host/files.fs targets/linux-x64/build.fs </dev/null
      - name: Linux on x86-64, the tool ucf-x64
        run: build/ucf-c -32 host/files.fs tools/ucf.fs targets/linux-x64/build.fs </dev/null
      - name: Linux on i386
        run: build/ucf-c -32 host/files.fs targets/linux-i386/build.fs </dev/null
      - name: Linux on i386, the tool ucf-i386
        run: build/ucf-c -32 host/files.fs tools/ucf.fs targets/linux-i386/build.fs </dev/null
      - name: Windows
        run: build/ucf-c -32 host/files.fs targets/win32/build.fs </dev/null
      - name: Windows, the tool ucf.exe
        run: build/ucf-c -32 host/files.fs tools/ucf.fs targets/win32/build.fs </dev/null
      - name: A PC with UEFI
        run: build/ucf-c -32 host/files.fs targets/uefi-x64/build.fs </dev/null
      - name: A PC with a BIOS (16-bit cells)
        run: build/ucf-c lib/package.fs lib/pc/bios.fs targets/freeze.fs host/files.fs targets/pc-bios/build.fs </dev/null
      - name: MS-DOS (16-bit cells)
        run: build/ucf-c host/files.fs targets/dos/build.fs </dev/null
      - name: Raspberry Pi 4
        run: build/ucf-c -32 targets/freeze.fs host/files.fs targets/rpi4/build.fs </dev/null
      - name: ESP32-S3
        run: >-
          build/ucf-c -32 lib/package.fs lib/idle.fs lib/esp32/rom.fs lib/esp32/esp32s3/chip.fs
          lib/esp32/intr.fs lib/esp32/gpio.fs lib/esp32/timers.fs lib/esp32/flash.fs lib/esp32/esp32s3/clock.fs
          lib/esp32/esp32s3/psram.fs lib/esp32/esp32s3/bootimg.fs targets/esp32s3/boot.fs targets/freeze.fs host/files.fs
          targets/esp32s3/build.fs </dev/null
      - name: ESP32
        run: >-
          build/ucf-c -32 lib/package.fs lib/idle.fs lib/esp32/rom.fs lib/esp32/esp32/chip.fs
          lib/esp32/intr.fs lib/esp32/gpio.fs lib/esp32/timers.fs lib/esp32/flash.fs lib/esp32/esp32/clock.fs
          lib/esp32/esp32/bootimg.fs targets/esp32/boot.fs targets/freeze.fs host/files.fs targets/esp32/build.fs </dev/null
      - name: A web browser
        run: build/ucf-c -32 host/files.fs targets/browser/build.fs </dev/null

      - name: Check that each file is there
        run: >-
          ls -l build/ucf-macos-a64 build/ucf build/ucf-macos-x64 build/ucf-intel
          build/ucf-linux-a64 build/ucf-a64 build/ucf-linux-x64 build/ucf-x64
          build/ucf-linux-i386 build/ucf-i386 build/ucf-win32.exe build/ucf.exe
          build/ucf-x64.efi build/ucf-pc.img build/ucf.com build/kernel8.img
          build/esp32s3.bin build/esp32.bin build/ucf-web.html
      - name: Remove the files that only the build needs
        run: rm build/ucf-c ucf.hex

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the folder with build/
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
